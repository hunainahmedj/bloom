<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bloom model & animation check</title>
<style>body{margin:24px;color:#28352c;background:#f5f3ec;font:14px system-ui}main{max-width:850px;margin:auto}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button{font:inherit;color:#40543d;background:#fff;border:1px solid #bcc8ae;border-radius:5px;padding:9px}button[aria-pressed=true]{background:#40543d;color:#fff}#stage{height:560px;position:relative;border-radius:12px;overflow:hidden;background:#1a2b23}canvas{width:100%;height:100%}#readout{font-variant-numeric:tabular-nums}</style></head><body><main><h1>Crown shapes & petal motion</h1><div class="controls"><button data-style="garden" aria-pressed="true">Garden</button><button data-style="rose" aria-pressed="false">Rose</button><button data-style="wildflower" aria-pressed="false">Wildflower</button><button id="bloom">Bloom again</button><button id="pause" aria-pressed="false">Pause animation</button><button id="step">Step 0.25 seconds</button><button id="effects" aria-pressed="true">Effects on</button><button id="worn" aria-pressed="false">Wear crown</button></div><div id="stage"><canvas id="scene"></canvas></div><p id="readout" role="status">Loading…</p><p>Real renderer. Pausing and stepping expose folded / open geometry for visual checks.</p></main><script type="module" src="/tests/model-preview.ts"></script></body></html>
