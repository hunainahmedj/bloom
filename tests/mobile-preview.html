<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bloom phone viewport check</title>
<style>body{margin:20px;background:#e8eae3;color:#28352c;font:14px system-ui}h1{font-size:16px;font-weight:500}iframe{display:block;width:390px;height:844px;max-width:100%;border:1px solid #b9c4ac;border-radius:12px;box-sizing:content-box;background:#f5f3ec}</style></head><body><h1>Bloom · 390 × 844 responsive viewport</h1><p id="measure" role="status">Loading phone preview…</p><button id="controls">Show crown controls</button><iframe title="Bloom phone preview" src="/"></iframe><script>const frame=document.querySelector('iframe');document.getElementById('controls').onclick=()=>frame.contentWindow.scrollTo(0,frame.contentDocument.getElementById('stage').getBoundingClientRect().top+frame.contentWindow.scrollY-60);frame.addEventListener('load',()=>{document.getElementById('measure').textContent=`Viewport ${frame.contentWindow.innerWidth}px; horizontal overflow: ${frame.contentDocument.documentElement.scrollWidth>frame.contentWindow.innerWidth?'yes':'no'}.`;});</script></body></html>
