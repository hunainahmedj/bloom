<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bloom hand settings check</title><style>body{margin:24px;font:14px system-ui;background:#f5f3ec;color:#28352c}main{max-width:850px;margin:auto}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{padding:9px 12px;border:1px solid #b5c5a8;border-radius:5px;font:inherit;background:#fff;color:#40543d}#stage{height:560px;position:relative;background:#1d2d25;border-radius:12px;overflow:hidden}canvas{width:100%;height:100%}.palette{position:absolute;bottom:18px;left:18px;right:18px;display:flex;gap:10px;z-index:3;justify-content:center}.palette button{min-width:130px;min-height:50px}.palette button[aria-pressed=true]{background:#e7c8df}.pointer{position:absolute;z-index:4;width:24px;height:24px;border:2px solid #dcf3ad;border-radius:50%;transform:translate(-50%,-50%);background:conic-gradient(#d5efa1 calc(var(--dwell,0)*360deg),#d5efa128 0);pointer-events:none}</style></head><body><main><h1>Hand selection while worn</h1><p>Simulated landmarks through the real gesture classifier, smoother, menu, crown controller and renderer. Grey volume is the diagnostic head mask.</p><div class="controls"><button id="aim-rose">Point at Rose</button><button id="aim-party">Point at Party</button><button id="pinch">Pinch crown</button><button id="release">Stop pointing</button><button id="reset">Wear again</button></div><div id="stage"><canvas id="scene"></canvas><div id="pointer" class="pointer" hidden></div><div class="palette"><button id="style-rose" aria-pressed="false">Rose</button><button id="mood-party" aria-pressed="false">Party</button></div></div><p id="readout" role="status">Loading…</p></main><script type="module" src="/tests/hand-settings-preview.ts"></script></body></html>
